version: "3.4"
services:
  resonite:
    image: kal47/resonite-headless-modded:latest
    container_name: resonite-headless-modded
    tty: true
    stdin_open: true
    environment:
      STEAMBETA: headless
      STEAMBETAPASSWORD: CHANGEME
      STEAMLOGIN: "USER PASSWORD"
    volumes:
      - resonite-data:/home/steam/resonite-headless
      - ./Config:/Config:ro
      - ./Logs:/Logs:rw
      - ./Libraries:/Libraries:ro
      - ./rml_libs:/rml_libs:ro
      - ./rml_mods:/rml_mods:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
volumes:
  resonite-data:
